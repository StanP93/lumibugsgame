    <script>
      // Файл игры не скачался — экран оставался тёмным навсегда (14.10: GitHub Pages в первые минуты после выкладки ответил
      // 503 на один кусок кода). Один раз перезагружаемся сами; не помогло — просим нажать и попробовать ещё раз. main.ts
      // пишет событие loadRetry. Текст здесь, а не в словарях: словари — в том самом коде, который не скачался.
      (function () {
        var KEY = 'glowjar.reload';
        var failed = false;
        function fail(what) {
          if (failed) return;
          failed = true;
          var last = 0;
          try {
            last = Number(sessionStorage.getItem(KEY)) || 0;
          } catch (e) {}
          if (Date.now() - last > 30000) {
            try {
              sessionStorage.setItem(KEY, String(Date.now()));
              sessionStorage.setItem(KEY + '.what', String(what).slice(-80));
            } catch (e) {}
            setTimeout(function () {
              location.reload();
            }, 1000);
            return;
          }
          var lang = (navigator.language || 'en').slice(0, 2);
          var text = {
            ru: 'Игра не загрузилась. Проверь интернет и нажми, чтобы попробовать ещё раз',
            es: 'El juego no se cargó. Revisa tu conexión y toca para intentarlo de nuevo',
            pt: 'O jogo não carregou. Verifique sua conexão e toque para tentar de novo',
            de: 'Das Spiel wurde nicht geladen. Prüfe deine Verbindung und tippe, um es noch einmal zu versuchen',
          }[lang] || "The game didn't load. Check your connection and tap to try again";
          var show = function () {
            var d = document.createElement('div');
            d.textContent = text;
            d.style.cssText =
              'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;' +
              'color:#ffe07a;font:700 20px/1.5 Nunito,system-ui,sans-serif;background:#1d1036;z-index:10';
            d.onclick = function () {
              location.reload();
            };
            document.body.appendChild(d);
          };
          if (document.body) show();
          else addEventListener('DOMContentLoaded', show);
        }
        // код игры и его куски: ошибка загрузки <script type="module"> и <link rel="modulepreload">
        addEventListener(
          'error',
          function (e) {
            var el = e.target;
            if (el && (el.tagName === 'SCRIPT' || (el.tagName === 'LINK' && el.rel === 'modulepreload'))) fail(el.src || el.href);
          },
          true,
        );
        // куски, которые грузятся позже (import() внутри Pixi)
        addEventListener('vite:preloadError', function (e) {
          e.preventDefault();
          fail((e.payload && e.payload.message) || 'import');
        });
      })();
    </script>
